[project]
name = "chunk-processor"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "vlm-common",
    "vlm-contracts",
    "vlm-messaging",
    "vlm-storage",
]
[tool.uv.sources]
vlm-common = { workspace = true }
vlm-contracts = { workspace = true }
vlm-messaging = { workspace = true }
vlm-storage = { workspace = true }
[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
