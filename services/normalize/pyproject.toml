[project]
name = "normalize"
version = "0.1.0"
description = "영상 검증, 정규화 사본·HLS 저장, video.normalized 발행 (SPEC-007)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vlm-common",
    "vlm-contracts",
    "vlm-messaging",
    "vlm-storage",
]

[tool.uv.sources]
vlm-common = { workspace = true }
vlm-contracts = { workspace = true }
vlm-messaging = { workspace = true }
vlm-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
