[project]
name = "track-stitcher"
version = "0.1.0"
description = "청크 경계 트랙 연결, Re-ID, track.manifest 발행 (SPEC-022)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "redis>=5",
    "vlm-common",
    "vlm-contracts",
    "vlm-messaging",
    "vlm-storage",
]

[tool.uv.sources]
vlm-common = { workspace = true }
vlm-contracts = { workspace = true }
vlm-messaging = { workspace = true }
vlm-storage = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
