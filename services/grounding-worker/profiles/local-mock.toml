# 모델 없이 흐름만 확인하는 로컬 프로필. GROUNDING_WORKER_ALLOW_MOCK=true일 때만 뜬다.
# mock 탐지기는 대상어와 시각으로 박스를 지어내므로 클립의 박스에 의미가 없다.

[detector]
kind = "mock"
# groundingModel. 결과 경로 한 단계가 되므로 콜론·슬래시를 쓰지 않는다.
version = "mock-grounding-v1"
# 기준 신뢰도는 AI 담당자가 실제 탐지기와 함께 정한다. 이 값은 동작 확인용 자리값이다.
score_threshold = 0.25

[render]
preset = "veryfast"
crf = 23
line_width = 3
# runtime 이미지의 fonts-dejavu-core가 설치하는 글꼴
font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
font_size = 24
