# 로컬 compose 실제 탐지기 프로필. 모델을 바꿀 때는 이 파일만 바꾼다. 코드는 바꾸지 않는다.
# 가중치는 docs local/scripts/upload-models.sh로 모델 버킷에 올린다. manifest 경로·sha256은 그 스크립트와 같아야 한다.

[detector]
# OWL-ViT base patch32(Apache-2.0). 대상어 문장을 그대로 텍스트 쿼리로 쓴다. 로컬 compose(CPU)에서 OWLv2 base는
# 프레임당 약 6초라 SPEC-026 NFR-1(10초 구간 30초)을 넘어 프레임당 0.45초인 이 모델을 쓴다(2026-11-07 측정).
kind = "owl"
manifest = "models/owlvit/owlvit-b32/manifest.json"
manifest_sha256 = "d61e583174e35fbce8264447cbb8e2864afb97f13489b491b718ba3bf61f1cc2"
# 실제 영상 1080p 프레임에서 사람 박스 점수가 0.12~0.18이었다(2026-11-07). 운영 값은 AI 담당자가
# Golden Set으로 정한다.
score_threshold = 0.1
nms_iou = 0.3

[render]
preset = "veryfast"
crf = 23
line_width = 3
# runtime 이미지의 fonts-dejavu-core가 설치하는 글꼴
font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
font_size = 24
