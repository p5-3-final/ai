# 모델 없이 흐름만 확인하는 로컬 프로필. AI_GATEWAY_ALLOW_MOCK=true일 때만 뜬다(SPEC-009 R-15).

[callers]
allowed = ["event-analyzer", "track-analyzer", "embedding-worker", "aggregator", "search-service", "quality-service"]

[images]
allowed_patterns = ['^sources/{source_id}/.+/blurred/[^/]+\.(jpg|jpeg|png|webp)$']

[adapters.mock]
kind = "mock"

[tasks.event_judge]
adapter = "mock"
model = "mock"
max_output_tokens = 800
max_images = 12
timeout_s = 5
max_retries = 0

[tasks.event_judge_escalate]
adapter = "mock"
model = "mock"
max_output_tokens = 800
max_images = 12
timeout_s = 5
max_retries = 0

[tasks.track_attribute]
adapter = "mock"
model = "mock"
max_output_tokens = 800
max_images = 3
timeout_s = 5
max_retries = 0

[tasks.object_question]
adapter = "mock"
model = "mock"
max_output_tokens = 800
max_images = 11
timeout_s = 5
max_retries = 0

# 의미 없는 결정적 벡터로 /v1/embed 흐름만 본다(SPEC-011). 실제 인코더는 local.toml을 쓴다.
[encoder]
kind = "mock"
model_id = "mock:MobileCLIP2-S0:dfndr2b:mean-4"
dimension = 512

[embed.embed_visual_text]
max_inputs = 16
max_text_chars = 300

[embed.embed_image]
max_inputs = 8
# 검색용 이미지는 search-service가 질의 전용 폴더에 올린다.
allowed_patterns = ['^queries/[^/]+/[^/]+\.(jpg|jpeg|png|webp)$']

[embed.embed_text]
adapter = "mock"
model = "mock"
dimension = 1024
max_inputs = 64
max_text_chars = 2000
timeout_s = 5
max_retries = 0

# 사전 밖 한국어 문장은 mock이 출력 예시를 돌려준다(SPEC-012).
[parse]
max_query_chars = 200
adapter = "mock"
model = "mock"
max_output_tokens = 200
timeout_s = 5
max_retries = 0
