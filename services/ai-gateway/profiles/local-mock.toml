# 모델 없이 흐름만 확인하는 로컬 프로필. AI_GATEWAY_ALLOW_MOCK=true일 때만 뜬다(SPEC-009 R-15).

[callers]
allowed = ["event-analyzer", "track-analyzer", "embedding-worker", "aggregator", "search-service", "quality-service"]

[images]
allowed_patterns = ['^sources/{source_id}/.+/blurred/[^/]+\.(jpg|jpeg|png|webp)$']

[adapters.mock]
kind = "mock"

[tasks.event_judge]
adapter = "mock"
model = "mock"
max_output_tokens = 800
max_images = 12
timeout_s = 5
max_retries = 0

[tasks.event_judge_escalate]
adapter = "mock"
model = "mock"
max_output_tokens = 800
max_images = 12
timeout_s = 5
max_retries = 0

[tasks.track_attribute]
adapter = "mock"
model = "mock"
max_output_tokens = 800
min_images = 1
max_images = 3
timeout_s = 5
max_retries = 0

[tasks.object_question]
adapter = "mock"
model = "mock"
max_output_tokens = 800
min_images = 1
max_images = 11
timeout_s = 5
max_retries = 0

[tasks.source_summary]
adapter = "mock"
model = "mock"
max_output_tokens = 600
max_images = 1
timeout_s = 5
max_retries = 0

# 의미 없는 결정적 벡터로 /v1/embed 흐름만 본다(SPEC-011). 실제 인코더는 local.toml을 쓴다.
[encoder]
kind = "mock"
model_id = "mock:MobileCLIP2-S0:dfndr2b:mean-4"
dimension = 512

[embed.embed_visual_text]
max_inputs = 16
max_text_chars = 300

[embed.embed_image]
max_inputs = 8
# 검색용 이미지는 search-service가 질의 전용 폴더에 올린다.
allowed_patterns = ['^queries/[^/]+/[^/]+\.(jpg|jpeg|png|webp)$']

[embed.embed_text]
adapter = "mock"
model = "mock"
dimension = 1024
max_inputs = 64
max_text_chars = 2000
timeout_s = 5
max_retries = 0

# 사전 밖 한국어 문장은 mock이 출력 예시를 돌려준다(SPEC-012).
[parse]
max_query_chars = 200
adapter = "mock"
model = "mock"
max_output_tokens = 200
timeout_s = 5
max_retries = 0

# 재고 비교 판정(SPEC-028 R-7). 직전 장면·이후 장면 두 장을 받는다.
[tasks.state_compare]
adapter = "mock"
model = "mock"
max_output_tokens = 800
min_images = 2
max_images = 2
timeout_s = 5
max_retries = 0

# 위험 노출 예측(SPEC-028 R-16). 외부 모델이 아니라 규칙 점수라 mock 프로필에서도 실제 값을 쓴다.
[adapters.rules]
kind = "predictor"

[adapters.rules.predictor]
horizons_sec = [600, 1800]
saturation_s = 1800

[tasks.risk_forecast]
adapter = "rules"
model = "rule-forecast-v1"
max_output_tokens = 200
max_images = 1
timeout_s = 1
max_retries = 0
