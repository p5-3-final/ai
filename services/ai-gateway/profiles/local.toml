# 로컬 compose 프로필. 로컬 Ollama(OpenAI 호환 API)의 Qwen3-VL을 쓴다(docs ADR-0008 "로컬").
# 모델을 바꿀 때는 이 파일만 바꾼다. 코드는 바꾸지 않는다.

[callers]
# docs overview "AI Gateway"의 호출자
allowed = ["event-analyzer", "track-analyzer", "embedding-worker", "aggregator", "search-service", "quality-service"]

[images]
# 블러 사본만 외부로 보낸다(SPEC-009 R-9). 실제 경로 규칙은 블러 사본을 만드는 chunk-processor 계약이
# 정해지면 맞춘다. {source_id}는 요청의 sourceId로 바뀐다.
allowed_patterns = ['^sources/{source_id}/.+/blurred/[^/]+\.(jpg|jpeg|png|webp)$']

[adapters.ollama]
kind = "openai_compatible"
# 호스트에서 도는 Ollama(Mac은 Docker가 GPU를 못 쓴다). Ollama는 DNS rebinding을 막으려고 임의의
# 호스트 이름 요청을 403으로 거절하므로, 허용되는 host.docker.internal로 붙는다.
base_url = "http://host.docker.internal:11434/v1"

[tasks.event_judge]
adapter = "ollama"
# 16GB 개발 머신에서 Docker와 함께 돌릴 수 있는 크기. 메모리가 넉넉하면 8b로 올린다.
# 기본 태그(4b)는 생각 단계가 켜져 있어 출력 상한을 생각에 다 쓰고 답이 빈다. OpenAI 호환 API로는
# 끌 수 없어 생각 단계가 없는 instruct 변형을 쓴다.
model = "qwen3-vl:4b-instruct"
max_output_tokens = 800
# 후보 전후 5초 근거 프레임(docs overview "분석 처리 흐름" 8단계)
max_images = 12
# 로컬 CPU 추론은 느리다
timeout_s = 120
max_retries = 1

# 이미지·질의 인코더(SPEC-011). frame-encoder와 같은 모델 ID여야 같은 인덱스를 찾는다.
# 가중치: Hugging Face timm/MobileCLIP2-S0-OpenCLIP의 open_clip_model.safetensors(Apple AMLR, 비상용)를
# 모델 버킷(AI_GATEWAY_MODELS_BUCKET)의 아래 키에 올려 둔다. 절차는 docs local/README.md
[encoder]
kind = "open_clip"
model_id = "open_clip:MobileCLIP2-S0:dfndr2b:mean-4"
dimension = 512
weights_key = "open_clip/MobileCLIP2-S0/dfndr2b/open_clip_model.safetensors"
weights_sha256 = "ab91a1a0c4330d6b1913e24d5035dfdea15423316aaec649610c6b1c6ddd0e95"

[embed.embed_visual_text]
max_inputs = 16
# 영어 검색 문장. 인코더 텍스트 입력은 77토큰에서 잘린다
max_text_chars = 300

[embed.embed_image]
max_inputs = 8
# 검색용 이미지는 search-service가 질의 전용 폴더에 올린다
allowed_patterns = ['^queries/[^/]+/[^/]+\.(jpg|jpeg|png|webp)$']

[embed.embed_text]
# VLM과 같은 호스트 Ollama(ollama pull bge-m3)
adapter = "ollama"
# 한국어 이벤트 설명문·검색 문장을 다뤄 다국어 모델을 쓴다. 운영은 text-embedding-3-small(1536차원)
model = "bge-m3"
dimension = 1024
# embedding-worker가 설명문을 묶어 보낸다
max_inputs = 64
max_text_chars = 2000
timeout_s = 30
max_retries = 1
