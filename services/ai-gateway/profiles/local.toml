# 로컬 compose 프로필. 로컬 Ollama(OpenAI 호환 API)의 Qwen3-VL을 쓴다(docs ADR-0008 "로컬").
# 모델을 바꿀 때는 이 파일만 바꾼다. 코드는 바꾸지 않는다.

[callers]
# docs overview "AI Gateway"의 호출자
allowed = ["event-analyzer", "track-analyzer", "embedding-worker", "aggregator", "search-service", "quality-service"]

[images]
# 블러 사본만 외부로 보낸다(SPEC-009 R-9). 실제 경로 규칙은 블러 사본을 만드는 chunk-processor 계약이
# 정해지면 맞춘다. {source_id}는 요청의 sourceId로 바뀐다.
allowed_patterns = ['^sources/{source_id}/.+/blurred/[^/]+\.(jpg|jpeg|png|webp)$']

[adapters.ollama]
kind = "openai_compatible"
# 호스트에서 도는 Ollama(Mac은 Docker가 GPU를 못 쓴다). Ollama는 DNS rebinding을 막으려고 임의의
# 호스트 이름 요청을 403으로 거절하므로, 허용되는 host.docker.internal로 붙는다.
base_url = "http://host.docker.internal:11434/v1"

[tasks.event_judge]
adapter = "ollama"
# 16GB 개발 머신에서 Docker와 함께 돌릴 수 있는 크기. 메모리가 넉넉하면 8b로 올린다.
# 기본 태그(4b)는 생각 단계가 켜져 있어 출력 상한을 생각에 다 쓰고 답이 빈다. OpenAI 호환 API로는
# 끌 수 없어 생각 단계가 없는 instruct 변형을 쓴다.
model = "qwen3-vl:4b-instruct"
max_output_tokens = 800
# 후보 전후 5초 근거 프레임(docs overview "분석 처리 흐름" 8단계)
max_images = 12
# 로컬 CPU 추론은 느리다
timeout_s = 120
max_retries = 1
# 예산 예약용 입력 토큰 예상값: 프롬프트·스키마 약 1500 + 이미지 12장 × 약 300(SPEC-016)
estimated_input_tokens = 5100

# 1차 판정이 severity high이거나 판단 불가일 때 다시 판정한다(SPEC-020 R-3, R-20). 운영은 더 강한 모델을
# 두는 자리다. 로컬은 개발 머신에 모델 하나만 올리도록 1차와 같은 모델·한도를 쓴다.
[tasks.event_judge_escalate]
adapter = "ollama"
model = "qwen3-vl:4b-instruct"
max_output_tokens = 800
max_images = 12
timeout_s = 120
max_retries = 1
estimated_input_tokens = 5100

# 트랙 속성 분석(SPEC-024 R-11). 모델·문안은 AI 담당자가 정한다. 로컬은 개발 머신에 모델 하나만 올리도록
# event_judge와 같은 모델·한도를 쓴다.
[tasks.track_attribute]
adapter = "ollama"
model = "qwen3-vl:4b-instruct"
max_output_tokens = 800
# 트랙 대표 크롭 1~3장
max_images = 3
timeout_s = 120
max_retries = 1
# 프롬프트·스키마 약 1500 + 크롭 3장 × 약 300
estimated_input_tokens = 2400

# 객체 자유 질문(SPEC-024 R-12)
[tasks.object_question]
adapter = "ollama"
model = "qwen3-vl:4b-instruct"
max_output_tokens = 800
# 크롭 1~3장 + 장면 프레임 0~8장
max_images = 11
timeout_s = 120
max_retries = 1
# 프롬프트·스키마 약 1500 + 이미지 11장 × 약 300
estimated_input_tokens = 4800

# 이미지·질의 인코더(SPEC-011). frame-encoder와 같은 모델 ID여야 같은 인덱스를 찾는다.
# 가중치: Hugging Face timm/MobileCLIP2-S0-OpenCLIP의 open_clip_model.safetensors(Apple AMLR, 비상용)를
# manifest와 함께 모델 버킷(AI_GATEWAY_MODELS_BUCKET)의 아래 경로에 올려 둔다. 절차는 docs local/README.md,
# manifest 해시는 docs local/scripts/upload-models.sh가 만드는 manifest의 값이다.
[encoder]
kind = "open_clip"
model_id = "open_clip:MobileCLIP2-S0:dfndr2b:mean-4"
dimension = 512
manifest = "models/mobileclip2-s0/dfndr2b/manifest.json"
manifest_sha256 = "569e79292c638ca67fbe5318adb212c3e26c73fbacfc6453268abf95c9266131"

[embed.embed_visual_text]
max_inputs = 16
# 영어 검색 문장. 인코더 텍스트 입력은 77토큰에서 잘린다
max_text_chars = 300

[embed.embed_image]
max_inputs = 8
# 검색용 이미지는 search-service가 질의 전용 폴더에 올린다
allowed_patterns = ['^queries/[^/]+/[^/]+\.(jpg|jpeg|png|webp)$']

[embed.embed_text]
# VLM과 같은 호스트 Ollama(ollama pull bge-m3)
adapter = "ollama"
# 한국어 이벤트 설명문·검색 문장을 다뤄 다국어 모델을 쓴다. 운영은 text-embedding-3-small(1536차원)
model = "bge-m3"
dimension = 1024
# embedding-worker가 설명문을 묶어 보낸다
max_inputs = 64
max_text_chars = 2000
timeout_s = 30
max_retries = 1

# 질의 해석(SPEC-012). 사전 밖 한국어 문장만 VLM과 같은 로컬 모델에 묻는다. 모델을 지우면 사전만 쓴다.
[parse]
# 검색창 한 줄
max_query_chars = 200
adapter = "ollama"
model = "qwen3-vl:4b-instruct"
# 대상어 3개와 이벤트 유형 목록이면 충분하다
max_output_tokens = 200
# 검색 응답을 오래 붙잡지 않는다. 넘으면 safe-fallback(R-13)
timeout_s = 20
max_retries = 0
# 프롬프트·스키마와 검색 문장 한 줄
estimated_input_tokens = 900

# 결과 캐시(SPEC-016). 외부 모델을 부르는 경로(event_judge, query_parse, embed_text)의 성공 결과를 재사용한다.
[cache]
retention_days = 30
front_ttl_s = 3600

# 하루 비용 한도(SPEC-016). 로컬 Ollama는 단가([prices])가 없어 비용 0이라 한도에 걸리지 않는다.
# 유료 모델 프로필은 [prices.<adapter>."<model>"]에 100만 토큰당 USD를 적는다.
[budget]
daily_limit_usd = 1.0
