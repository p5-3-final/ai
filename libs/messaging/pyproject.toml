[project]
name = "vlm-messaging"
version = "0.1.0"
description = "Kafka 소비·발행, retry 토픽, DLQ, 수동 offset 커밋"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.16.1",
    "vlm-common",
    "vlm-contracts",
]

[tool.uv.sources]
vlm-contracts = { workspace = true }
vlm-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
