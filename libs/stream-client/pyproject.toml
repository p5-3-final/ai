[project]
name = "vlm-stream-client"
version = "0.1.0"
description = "stream-service REST 클라이언트. 계약은 docs 레포 service-contracts/openapi/stream-service.yaml (SPEC-027 R-33)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "vlm-common",
]

[tool.uv.sources]
vlm-common = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
