[project]
name = "vlm-evals"
version = "0.1.0"
description = "평가 잡의 매칭 규칙과 처리 단계 성능 Gate CI 명령 (SPEC-030 R-11·R-12·R-19). 배포 단위가 아니다"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "vlm-common",
    "vlm-quality-client",
]

[tool.uv.sources]
vlm-common = { workspace = true }
vlm-quality-client = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "evals"
