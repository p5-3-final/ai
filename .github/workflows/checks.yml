# 모든 PR에서 실행하는 공통 검사. ruleset의 필수 검사로 등록한다.
# 서비스별 이미지 빌드·배포 workflow는 .github/workflows/<service>.yml에 따로 둔다.
name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 루트 AGENTS.md "Git 규칙"의 type 목록과 같게 유지한다.
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            build
            ci
            perf

  # Dockerfile 검사(hadolint)는 첫 서비스 Dockerfile이 생길 때 이 job에 더한다.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: zizmor
        run: pipx run zizmor==1.31.1 --format plain .github/workflows

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 계약 테스트가 docs 레포의 이벤트 JSON Schema 원본을 읽는다(public 레포라 토큰이 필요 없다).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: p5-3-final/docs
          path: docs-repo
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: sync
        run: uv sync --all-packages --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      # messaging 통합 테스트는 testcontainers로 Kafka를 띄운다(GitHub 호스트 러너에 Docker가 있다).
      - name: pytest
        run: uv run pytest
        env:
          CONTRACTS_DIR: ${{ github.workspace }}/docs-repo/docs/contracts
