# 모든 PR에서 실행하는 공통 검사. ruleset의 필수 검사로 등록한다.
# 서비스별 이미지 빌드·배포 workflow는 .github/workflows/<service>.yml에 따로 둔다.
name: checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 루트 AGENTS.md "Git 규칙"의 type 목록과 같게 유지한다.
          types: |
            feat
            fix
            refactor
            test
            docs
            chore
            build
            ci
            perf

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
      - name: zizmor
        run: pipx run zizmor==1.31.1 --format plain .github/workflows
      # 필수 검사 목록을 늘리지 않으려고 Dockerfile 검사도 이 job에서 한다(ci-common.md).
      - name: hadolint
        run: |
          for dockerfile in services/*/Dockerfile; do
            docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < "${dockerfile}"
          done

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 계약 테스트가 서비스 간 계약을 읽는다. docs main이 아니라 service-contracts.lock 버전을 받는다
      # (docs ADR-0013, public 릴리스라 토큰이 필요 없다).
      - name: service contracts
        run: scripts/fetch-service-contracts.sh
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: sync
        run: uv sync --all-packages --locked
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      # 통합 테스트는 testcontainers로 Kafka·SeaweedFS를 띄운다(GitHub 호스트 러너에 Docker가 있다).
      # ffmpeg 테스트는 아래 service-images job이 운영과 같은 이미지에서 돌린다.
      - name: pytest
        run: uv run pytest -m "not ffmpeg and not model"
        env:
          CONTRACTS_DIR: ${{ github.workspace }}/.service-contracts/service-contracts

  service-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: service contracts
        run: scripts/fetch-service-contracts.sh
      - name: normalize ffmpeg tests
        run: scripts/test-in-docker.sh normalize -m ffmpeg
        env:
          CONTRACTS_DIR: ${{ github.workspace }}/.service-contracts/service-contracts
      - name: normalize runtime image
        run: docker build -f services/normalize/Dockerfile --target runtime -t vlm/normalize .
      - name: chunk processor ffmpeg tests
        run: scripts/test-in-docker.sh chunk-processor -m ffmpeg
        env:
          CONTRACTS_DIR: ${{ github.workspace }}/.service-contracts/service-contracts
      - name: chunk processor runtime image
        run: docker build -f services/chunk-processor/Dockerfile --target runtime -t vlm/chunk-processor .
      - name: frame encoder runtime image
        run: docker build -f services/frame-encoder/Dockerfile --target runtime -t vlm/frame-encoder .
      - name: event analyzer runtime image
        run: docker build -f services/event-analyzer/Dockerfile --target runtime -t vlm/event-analyzer .
      - name: track analyzer runtime image
        run: docker build -f services/track-analyzer/Dockerfile --target runtime -t vlm/track-analyzer .
      - name: track stitcher runtime image
        run: docker build -f services/track-stitcher/Dockerfile --target runtime -t vlm/track-stitcher .
      - name: aggregator runtime image
        run: docker build -f services/aggregator/Dockerfile --target runtime -t vlm/aggregator .
      # 분류 체계는 잠금 버전의 계약을 이름 있는 빌드 컨텍스트로 넘긴다(docs ADR-0012·0013).
      - name: ai-gateway runtime image
        run: >-
          docker build -f services/ai-gateway/Dockerfile
          --build-context vlm-contracts:docs=.service-contracts/service-contracts
          -t vlm/ai-gateway .
