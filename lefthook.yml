# 커밋 전 빠른 검사. 관문은 CI이며 같은 검사를 전체 대상으로 다시 실행한다(shellcheck는 로컬 검사만 한다).
pre-commit:
  parallel: true
  jobs:
    - name: ruff-check
      glob: "*.py"
      run: uv run ruff check {staged_files}
    - name: ruff-format
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    - name: hadolint
      glob: "Dockerfile"
      run: hadolint {staged_files}
    - name: shellcheck
      glob: "*.sh"
      run: shellcheck {staged_files}
